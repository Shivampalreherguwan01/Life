plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shivampal.life'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shivampal.life'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
